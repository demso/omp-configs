providers:
  cheapference:
    baseUrl: https://api.cheaperinference.com/v1
    api: openai-completions
    apiKey: CHEAP_API_KEY
    models:
      - id: deepseek-v4-flash-0731
        name: DS V4 Flash 0731
      - id: gpt-5.6-luna
        name: GPT 5.6 Luna
  surplus:
    baseUrl: https://api.surplusintelligence.ai/v1
    api: openai-completions
    apiKey: SURPLUS_KEY
    headers:
      X-Min-Discount: '40'
    compat:
      extraBody:
        si_route:
          objective: latency
          price_tolerance_pct: 1
          max_latency_ms: 100000
    modelOverrides:
      kimi-k3:
        supportsTools: false
    models:
      - id: glm-5.3-flash
        name: GLM-5.3-Flash (surplus)
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072
        compat:
          extraBody:
            min_discount_pct: 60
            si_route:
              objective: latency
              price_tolerance_pct: 15

